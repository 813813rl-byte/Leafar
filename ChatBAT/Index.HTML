<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatBAT</title>

<style>

body{
    background:#121212;
    color:white;
    font-family:Arial,sans-serif;
    max-width:800px;
    margin:auto;
    padding:20px;
}

h1{
    color:#6ea8fe;
}

#chat{
    background:#1e1e1e;
    border:1px solid #333;
    border-radius:8px;
    height:400px;
    overflow-y:auto;
    padding:10px;
    color:white;
}

#chat div{
    color:white;
    margin-bottom:5px;
}

input{
    background:#2a2a2a;
    color:white;
    border:1px solid #444;
    border-radius:5px;
    padding:8px;
    margin:5px;
}

button{
    background:#6ea8fe;
    color:white;
    border:none;
    border-radius:5px;
    padding:8px 12px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

b{
    color:#6ea8fe;
}

</style>

</head>

<body>

<h1>📡 ChatBAT</h1>

<input id="nome" placeholder="Seu nome">
<input id="sala" placeholder="Sala" value="amigos">

<br>

<div id="chat"></div>

<br>

<input id="msg" placeholder="Mensagem" style="width:70%;">
<button onclick="enviar()">Enviar</button>

<script>

const firebaseURL =
"https://chatbat-39793-default-rtdb.firebaseio.com";

async function enviar(){

    let nome = document.getElementById("nome").value;
    let sala = document.getElementById("sala").value;
    let texto = document.getElementById("msg").value;

    if(!nome || !texto) return;

    await fetch(
        `${firebaseURL}/salas/${sala}.json`,
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                nome:nome,
                texto:texto,
                hora:new Date().toLocaleTimeString()
            })
        }
    );

    document.getElementById("msg").value="";
}

async function atualizar(){

    let sala = document.getElementById("sala").value;

    if(!sala) return;

    let resposta =
    await fetch(`${firebaseURL}/salas/${sala}.json`);

    let dados = await resposta.json();

    let chat = document.getElementById("chat");

    chat.innerHTML="";

    if(dados){

        Object.values(dados).forEach(m=>{

            chat.innerHTML +=
            `<div>[${m.hora}] <b>${m.nome}</b>: ${m.texto}</div>`;

        });

        chat.scrollTop = chat.scrollHeight;
    }
}

setInterval(atualizar,2000);

</script>

</body>
</html>
