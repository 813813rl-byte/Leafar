<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatBAT</title>

<style>

body{
    background:#121212;
    color:white;
    font-family:Arial,sans-serif;
    max-width:800px;
    margin:auto;
    padding:20px;
}

h1{ color:#6ea8fe; }

#online{
    background:#1e1e1e;
    border:1px solid #333;
    border-radius:8px;
    padding:10px;
    margin-bottom:10px;
}

#chat{
    background:#1e1e1e;
    border:1px solid #333;
    border-radius:8px;
    height:400px;
    overflow-y:auto;
    padding:10px;
}

#typing{
    font-style:italic;
    color:#aaa;
    margin:5px 0;
    height:20px;
}

input{
    background:#2a2a2a;
    color:white;
    border:1px solid #444;
    border-radius:5px;
    padding:8px;
    margin:5px;
}

button{
    background:#6ea8fe;
    color:white;
    border:none;
    border-radius:5px;
    padding:8px 12px;
    cursor:pointer;
}

button:hover{ opacity:0.9; }

b{ color:#6ea8fe; }

</style>

</head>

<body>

<h1>📡 ChatBAT</h1>

<div id="online">👥 Online: carregando...</div>
<div id="typing"></div>

<input id="nome" placeholder="Seu nome">
<input id="sala" placeholder="Sala" value="amigos">

<br>

<div id="chat"></div>

<br>

<input id="msg" placeholder="Mensagem" style="width:70%;" oninput="digitando()">
<button onclick="enviar()">Enviar</button>

<audio id="som">
<source src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg">
</audio>

<script>

const firebaseURL =
"https://chatbat-39793-default-rtdb.firebaseio.com";

let ultimoSnapshot = "";


/* 🔥 SOM */
function tocarSom(){

    const ctx = new AudioContext();

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.frequency.value = 700;

    gain.gain.setValueAtTime(0.03, ctx.currentTime);

    osc.start();

    osc.stop(ctx.currentTime + 0.08);
}

/* ✍️ DIGITANDO */
async function digitando(){

    let nome = document.getElementById("nome").value;
    let sala = document.getElementById("sala").value;

    if(!nome || !sala) return;

    await fetch(`${firebaseURL}/typing/${sala}/${nome}.json`, {
        method:"PUT",
        body:JSON.stringify(Date.now())
    });
}

/* 🔥 ENVIAR */
async function enviar(){

    let nome = document.getElementById("nome").value;
    let sala = document.getElementById("sala").value;
    let texto = document.getElementById("msg").value;

    if(!nome || !texto) return;

    await fetch(`${firebaseURL}/salas/${sala}.json`, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
            nome:nome,
            texto:texto,
            hora:new Date().toLocaleTimeString()
        })
    });

    document.getElementById("msg").value="";
}

/* 💬 CHAT (TEMPO REAL MELHORADO) */
async function atualizar(){

    let sala = document.getElementById("sala").value;
    if(!sala) return;

    let resposta = await fetch(`${firebaseURL}/salas/${sala}.json`);
    let dados = await resposta.json();

    let chat = document.getElementById("chat");

    let novoSnapshot = JSON.stringify(dados);

    if(novoSnapshot !== ultimoSnapshot){
        ultimoSnapshot = novoSnapshot;

        chat.innerHTML="";

        if(dados){

            Object.values(dados).forEach(m=>{
                chat.innerHTML +=
                `<div>[${m.hora}] <b>${m.nome}</b>: ${m.texto}</div>`;
            });

            chat.scrollTop = chat.scrollHeight;

tocarSom();

let ultimaMensagem =
    Object.values(dados)[Object.values(dados).length - 1];

let meuNome =
    document.getElementById("nome").value;

if(
    Notification.permission === "granted" &&
    ultimaMensagem.nome !== meuNome
){

    new Notification(
        ultimaMensagem.nome,
        {
            body: ultimaMensagem.texto,
            tag:"chatbat"
        }
    );
}
/* 👥 ONLINE */
async function atualizarOnline(){

    let nome = document.getElementById("nome").value;
    let sala = document.getElementById("sala").value;

    if(!nome || !sala) return;

    await fetch(`${firebaseURL}/online/${sala}/${nome}.json`, {
        method:"PUT",
        body:JSON.stringify(Date.now())
    });

    let resposta = await fetch(`${firebaseURL}/online/${sala}.json`);
    let dados = await resposta.json();

    let lista = [];

    if(dados){
        let agora = Date.now();

        for(let usuario in dados){
            if(agora - dados[usuario] < 30000){
                lista.push(usuario);
            }
        }
    }

    document.getElementById("online").innerHTML =
        "👥 Online ("+lista.length+"): " + lista.join(", ");
}

/* 🔔 NOTIFICAÇÕES */
if("Notification" in window){
    Notification.requestPermission();
}

/* ⏱️ LOOP */
setInterval(atualizar,1500);
setInterval(atualizarOnline,8000);

</script>

</body>
</html>
